name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Integration tests talk to a real MariaDB and create their own temp users.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: cls_facility
          MARIADB_USER: cls_app
          MARIADB_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: "mysql://cls_app:ci-app-password@127.0.0.1:3306/cls_facility?connectionLimit=5&acquireTimeout=30000"
      BETTER_AUTH_SECRET: ci-only-secret-never-used-in-production
      BETTER_AUTH_URL: "http://localhost:3000"
      PRIVATE_STORAGE_ROOT: ${{ github.workspace }}/.data
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload failure logs
        if: failure()
        run: ls -la .next/cache 2>/dev/null | head -20 || true
