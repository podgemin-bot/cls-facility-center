name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Integration tests talk to a real MariaDB and create their own temp users.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: cls_facility
          MARIADB_USER: cls_app
          MARIADB_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: "mysql://cls_app:ci-app-password@127.0.0.1:3306/cls_facility?connectionLimit=5&acquireTimeout=30000"
      BETTER_AUTH_SECRET: ci-only-secret-never-used-in-production
      BETTER_AUTH_URL: "http://localhost:3000"
      PRIVATE_STORAGE_ROOT: ${{ github.workspace }}/.data
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npm run db:deploy

      # The VM runs MariaDB with lower_case_table_names = 0 (case-sensitive).
      # This job replays every migration twice on a throwaway database on Linux
      # and asserts the exact-case tables Prisma expects exist. Windows can never
      # run this — the local server folds names — so it has to live here.
      - name: Verify fresh migrations on Linux (exact case)
        env:
          DATABASE_URL: "mysql://root:ci-root-password@127.0.0.1:3306/cls_facility?connectionLimit=2&acquireTimeout=30000"
        run: npm run db:verify-fresh

      # Windows dumps store table names lowercase; the VM (lctn=0) cannot read
      # them. portable-dump must re-case CREATE TABLE / INSERT INTO etc to the
      # exact names the migrations create. This is the same check the operator
      # runs before shipping a new Windows-made dump.
      - name: Portable dump rewrites table-name case for Linux
        run: |
          set -euo pipefail
          # Windows dumps name tables in lowercase (server lower_case_table_names=1);
          # the VM stores them exact-case, so dump table names must match the
          # migrations. The fixture ships as base64 so this step contains no
          # backticks inside single quotes.
          printf '%s' 'Q1JFQVRFIFRBQkxFIGByb29tc2VjdXJpdHlgICgNCiAgYGlkYCBpbnQgTk9UIE5VTEwNCik7DQpJTlNFUlQgSU5UTyBgcm9vbXNlY3VyaXR5YCBWQUxVRVMgKDEpOw0K' | base64 -d > /tmp/win-dump.sql
          gzip -f /tmp/win-dump.sql
          node scripts/portable-dump.mjs /tmp/win-dump.sql.gz /tmp/linux-dump.sql.gz
          gunzip -f /tmp/linux-dump.sql.gz
          grep -q 'RoomSecurity' /tmp/linux-dump.sql
          if grep -q 'roomsecurity' /tmp/linux-dump.sql; then echo "lowercase table name leaked" >&2; exit 1; fi
          echo "portable dump case rewrite ok"

      - name: Lint
        run: npm run lint

      # The VM shell never runs in CI otherwise. bash -n catches syntax
      # mistakes and ShellCheck catches the quoting ones, for both deploy/*.sh
      # and every run: block embedded in the workflows.
      - name: Shellcheck the deploy scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          node scripts/lint-deploy-scripts.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload failure logs
        if: failure()
        run: ls -la .next/cache 2>/dev/null | head -20 || true
