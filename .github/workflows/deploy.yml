name: Deploy

# Only a green CI run on main may deploy. The VM pulls the source and builds it
# itself on ARM64, so nothing platform-specific ever crosses the wire.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit sha or branch to deploy"
        required: true
        default: main
      full:
        description: "Also run lint, tests and typecheck on the VM"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Release to the VM
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Resolve the ref to deploy
        id: ref
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "$REQUESTED_REF^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # actions/checkout only uses the key for its own git fetch, so the same
          # key has to be on disk for the scp and ssh calls below.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Upload deploy scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/release.sh deploy/backup.sh deploy/restore.sh "$target:/tmp/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$target" \
            "sudo install -m 0750 -o root -g root /tmp/release.sh /tmp/backup.sh /tmp/restore.sh /opt/cls-facility/bin/ && rm -f /tmp/release.sh /tmp/backup.sh /tmp/restore.sh"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.ref.outputs.sha }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          extra=""
          if [[ "$FULL" == "true" ]]; then extra="--full"; fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$target" \
            "/opt/cls-facility/bin/release.sh --ref $SHA --yes $extra"

      - name: Smoke check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$target" \
            "curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:3000/login && systemctl is-active cls-facility && readlink -f /opt/cls-facility/current"
